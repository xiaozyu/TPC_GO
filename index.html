<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPC_GO 排工標記盤</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: relative; background: #fff; }

        #sidebar { 
            width: 360px; 
            background: #ffffff; 
            border-right: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            gap: 8px; 
            z-index: 1001; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
            transition: transform 0.25s ease;
        }

        #map { flex: 1; height: 100%; width: 100%; z-index: 1; }

        .header-box { display: flex; justify-content: space-between; align-items: center; }
        h3 { font-size: 16px; color: #1a1a1a; font-weight: 800; }
        .toggle-btn { display: none; background: #007bff; color: white; border: none; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: bold; }

        textarea { 
            width: 100%; 
            height: 95px; 
            padding: 8px; 
            font-size: 13px; 
            resize: none; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: monospace; 
            background: #f8fafc;
        }

        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button { 
            width: 100%; 
            padding: 9px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
            touch-action: manipulation;
        }
        button:active { filter: brightness(0.9); }
        
        .launch-all-btn { background: #e65100; font-size: 13px; }
        .copy-btn { background: #28a745; }
        .clear-btn { background: #6c757d; padding: 5px; font-size: 11px; font-weight: normal; }

        #list { flex: 1; overflow-y: auto; border-top: 1px solid #eee; padding-top: 6px; -webkit-overflow-scrolling: touch; }
        
        .item { 
            background: #f8fafc; 
            padding: 8px 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            margin-bottom: 6px; 
            font-size: 13px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            touch-action: pan-y;
            user-select: none;
        }
        .item.sortable-ghost { opacity: 0.4; background: #e2e8f0; }
        .drag-handle { cursor: grab; color: #94a3b8; font-size: 14px; margin-right: 8px; }
        .item-nav-btn { background: #ff9800; color: white; padding: 5px 8px; font-size: 11px; border-radius: 4px; border: none; font-weight: bold; white-space: nowrap; }

        .hint { font-size: 11px; color: #666; line-height: 1.3; }
        .quick-stations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-top: 1px solid #eee; padding-top: 6px; }
        .quick-btn { background: #eef2f5; color: #333; font-size: 11px; padding: 5px 2px; border: 1px solid #d1d9e0; border-radius: 4px; font-weight: normal; }

        .permanent-label {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .road-text { color: #facc15; font-weight: normal; margin-left: 2px; }

        .base-label {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #475569;
            color: #f1f5f9;
            font-size: 9px;
            font-weight: normal;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                max-height: 82vh;
                border-right: none;
                border-bottom: 3px solid #007bff;
                border-radius: 0 0 14px 14px;
            }
            #sidebar.collapsed {
                transform: translateY(-92%);
                box-shadow: none;
            }
            #sidebar.collapsed .hide-on-collapse {
                display: none;
            }
            .toggle-btn { display: block; }
            textarea { height: 80px; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header-box">
        <h3>⚡ 台電排工標記盤</h3>
        <button class="toggle-btn" onclick="toggleSidebar()">展開/收合</button>
    </div>

    <div class="hint hide-on-collapse">自動補G、S延伸計算。<b>按住 ☰ 滑動排工順序</b></div>

    <textarea id="input" class="hide-on-collapse" placeholder="貼上今日案件：
4143ae57
g4464sa97
4464sa97
g3759aa7788"></textarea>

    <div class="btn-group hide-on-collapse">
        <button onclick="renderMarkers(true)">在地圖上標記點位</button>
        <button class="launch-all-btn" onclick="launchTitanBatch()">🚀 整批匯入巨擎導航 (依排序)</button>
        <button class="copy-btn" onclick="copySortedList()">📋 複製已排案件清單</button>
        <button class="clear-btn" onclick="clearAll()">清空重填</button>
    </div>

    <div class="quick-stations hide-on-collapse">
        <button class="quick-btn" onclick="locateBase(0)">龍井服務所</button>
        <button class="quick-btn" onclick="locateBase(1)">沙鹿服務所</button>
        <button class="quick-btn" onclick="locateBase(2)">南勢溪公園</button>
        <button class="quick-btn" onclick="locateBase(3)">萬興陸橋</button>
        <button class="quick-btn" onclick="locateBase(4)">中華向上陸橋</button>
        <button class="quick-btn" onclick="locateBase(5)">國三沙田交叉</button>
    </div>

    <div id="list" class="hide-on-collapse"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const TITAN_NAV_URL = 'https://xiaozyu.github.io/TPCMap/';

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    }

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    });

    const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['0', '1', '2', '3'],
        attribution: '&copy; Google'
    });

    const map = L.map('map', {
        center: [24.2100, 120.5500],
        zoom: 12,
        zoomControl: false,
        layers: [osm]
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.layers({ "標準道路圖": osm, "Google 衛星混合": googleHybrid }, null, { position: 'topright' }).addTo(map);

    const baseLocations = [
        { name: "龍井所", lat: 24.19277, lng: 120.54595, color: "green", desc: "公務點" },
        { name: "沙鹿所", lat: 24.23078, lng: 120.56306, color: "green", desc: "公務點" },
        { name: "南勢溪", lat: 24.22550, lng: 120.56470, color: "orange", desc: "午休點" },
        { name: "萬興陸橋", lat: 24.17250, lng: 120.54220, color: "orange", desc: "午休點" },
        { name: "中華向上", lat: 24.21520, lng: 120.53680, color: "orange", desc: "午休點" },
        { name: "國三沙田", lat: 24.20967, lng: 120.55835, color: "orange", desc: "停駐點" }
    ];

    const baseMarkers = [];
    baseLocations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng], {
            icon: L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${loc.color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [15, 25],
                iconAnchor: [7, 25],
                popupAnchor: [1, -22],
                shadowSize: [25, 25]
            })
        }).addTo(map);

        marker.bindTooltip(loc.name, {
            permanent: true,
            direction: 'bottom',
            offset: [0, 4],
            className: 'base-label'
        });

        marker.bindPopup(`<b>【${loc.desc}】${loc.name}</b><br><a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank">Google 導航</a>`);
        baseMarkers.push(marker);
    });

    let markersLayer = L.layerGroup().addTo(map);
    let parsedCases = [];

    const listContainer = document.getElementById('list');
    Sortable.create(listContainer, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function () {
            const items = listContainer.querySelectorAll('.item');
            const reordered = [];
            items.forEach((itemDom, newIdx) => {
                const oldIdx = parseInt(itemDom.getAttribute('data-index'), 10);
                const caseData = parsedCases[oldIdx];
                caseData.displayIndex = newIdx + 1;
                reordered.push(caseData);
            });
            parsedCases = reordered;
            refreshMarkersAndList();
        }
    });

    function locateBase(index) {
        const target = baseLocations[index];
        map.flyTo([target.lat, target.lng], 16);
        baseMarkers[index].openPopup();
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    }

    async function fetchRoadName(lat, lng) {
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
            const resp = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
            if (!resp.ok) return '';
            const data = await resp.json();
            const addr = data.address || {};
            return addr.road || addr.street || addr.suburb || addr.neighbourhood || '';
        } catch (e) {
            return '';
        }
    }

    function twd97ToWGS84(x, y) {
        const a = 6378137.0, b = 6356752.314245;
        const lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
        const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = e * e / (1 - e * e);
        
        x = x - dx;
        const m = y / k0;
        const mu = m / (a * (1 - e * e / 4 - 3 * e * e * e * e / 64 - 5 * e * e * e * e * e * e / 256));
        const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));
        
        const j1 = 3 * e1 / 2 - 27 * e1 * e1 * e1 / 32;
        const j2 = 21 * e1 * e1 / 16 - 55 * e1 * e1 * e1 / 32;
        const j3 = 151 * e1 * e1 * e1 / 96;
        
        const fp = mu + j1 * Math.sin(2 * mu) + j2 * Math.sin(4 * mu) + j3 * Math.sin(6 * mu);
        const c1 = e2 * Math.cos(fp) * Math.cos(fp);
        const t1 = Math.tan(fp) * Math.tan(fp);
        const r1 = a * (1 - e * e) / Math.pow(1 - e * e * Math.sin(fp) * Math.sin(fp), 1.5);
        const n1 = a / Math.sqrt(1 - e * e * Math.sin(fp) * Math.sin(fp));
        const d = x / (n1 * k0);
        
        const lat = fp - (n1 * Math.tan(fp) / r1) * (d * d / 2 - (5 + 3 * t1 + 10 * c1 - 4 * c1 * c1 - 9 * e2) * d * d * d * d / 24);
        const lon = lon0 + (d - (1 + 2 * t1 + c1) * d * d * d / 6) / Math.cos(fp);
        
        return { lat: lat * 180 / Math.PI, lng: lon * 180 / Math.PI };
    }

    function parsePowerCoord(codeStr) {
        let cleaned = codeStr.replace(/\s+/g, '').toUpperCase();
        
        if (/^\d{4}[A-Z]{2}(\d{2}|\d{4})$/.test(cleaned)) {
            cleaned = 'G' + cleaned;
        }

        const match = cleaned.match(/^([A-HJ-Z])(\d{2})(\d{2})([A-Z])([A-Z])(\d{2}|\d{4})$/);
        if (!match) return null;

        const [_, zone, xMap, yMap, subX, subY, pt] = match;
        const originMap = {
            'A': [170000, 2750000], 'B': [250000, 2750000],
            'C': [170000, 2700000], 'D': [250000, 2700000],
            'E': [170000, 2650000], 'F': [250000, 2650000],
            'G': [170000, 2650000], 'H': [250000, 2600000]
        };

        const baseOrigin = originMap[zone] || [170000, 2650000];
        let twdX = baseOrigin[0] + parseInt(xMap, 10) * 800;
        let twdY = baseOrigin[1] + parseInt(yMap, 10) * 500;

        twdX += (subX.charCodeAt(0) - 65) * 100;
        twdY += (subY.charCodeAt(0) - 65) * 100;

        if (pt.length === 2) {
            twdX += parseInt(pt[0], 10) * 10;
            twdY += parseInt(pt[1], 10) * 10;
        } else if (pt.length === 4) {
            twdX += parseInt(pt.substring(0, 2), 10);
            twdY += parseInt(pt.substring(2, 4), 10);
        }

        return { ...twd97ToWGS84(twdX, twdY), standardCode: cleaned };
    }

    function launchTitanDirect(code, lat, lng) {
        const url = `${TITAN_NAV_URL}?code=${encodeURIComponent(code)}&lat=${lat}&lng=${lng}`;
        window.open(url, '_blank');
    }

    function launchTitanBatch() {
        if (parsedCases.length === 0) {
            alert("請先輸入案件並標記！");
            return;
        }
        const encodedData = encodeURIComponent(parsedCases.map(c => `案件${c.displayIndex} ${c.code}`).join('\n'));
        const url = `${TITAN_NAV_URL}?batch=${encodedData}`;
        window.open(url, '_blank');
    }

    function refreshMarkersAndList() {
        markersLayer.clearLayers();
        listContainer.innerHTML = '';
        const bounds = [];
        baseLocations.forEach(loc => bounds.push([loc.lat, loc.lng]));

        parsedCases.forEach((c, idx) => {
            bounds.push([c.lat, c.lng]);
            const marker = L.marker([c.lat, c.lng]).addTo(markersLayer);
            c.marker = marker;

            const title = `案件 ${c.displayIndex}`;
            const roadLabel = c.road ? ` | ${c.road}` : '';

            marker.bindTooltip(`<b>${title}</b> <span class="road-text">(${c.code}${roadLabel})</span>`, {
                permanent: true,
                direction: 'top',
                offset: [0, -10],
                className: 'permanent-label'
            });

            const googleNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`;
            marker.bindPopup(`
                <b>${title}</b><br>
                ${c.road ? `<b>路名: ${c.road}</b><br>` : ''}
                圖號: ${c.code}<br>
                WGS84: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}<br><br>
                <button onclick="launchTitanDirect('${c.code}', ${c.lat}, ${c.lng})" style="background:#ff9800;padding:7px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-bottom:6px;">🚀 開啟巨擎導航</button>
                <a href="${googleNavUrl}" target="_blank" style="color:#007bff;font-size:12px;text-decoration:none;">開啟 Google 導航</a>
            `);

            const item = document.createElement('div');
            item.className = 'item';
            item.setAttribute('data-index', idx);
            item.innerHTML = `
                <div style="display:flex;align-items:center;flex:1;">
                    <span class="drag-handle">☰</span>
                    <div>
                        <b>${title}</b> <span style="font-size:11px;color:#666;">${c.code}</span><br>
                        <span style="color:#007bff;font-size:11px;">${c.road ? `(${c.road})` : ''}</span>
                    </div>
                </div>
                <button class="item-nav-btn" onclick="event.stopPropagation(); launchTitanDirect('${c.code}', ${c.lat}, ${c.lng})">🚀 導航</button>
            `;
            item.onclick = () => {
                map.flyTo([c.lat, c.lng], 17);
                marker.openPopup();
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.add('collapsed');
                }
            };
            listContainer.appendChild(item);
        });
    }

    async function renderMarkers(autoCollapseOnMobile = false) {
        parsedCases = [];
        const lines = document.getElementById('input').value.trim().split('\n');

        for (let index = 0; index < lines.length; index++) {
            let line = lines[index].trim();
            if (!line) continue;

            let lat = null, lng = null, standardCode = '';
            const parts = line.split(/\s+/);
            let payload = parts.length > 1 ? parts[parts.length - 1] : parts[0];

            const powerRes = parsePowerCoord(payload);
            if (powerRes) {
                lat = powerRes.lat;
                lng = powerRes.lng;
                standardCode = powerRes.standardCode;
            } else if (payload.includes(',')) {
                const [la, ln] = payload.split(',');
                lat = parseFloat(la);
                lng = parseFloat(ln);
                standardCode = `${lat.toFixed(5)},${lng.toFixed(5)}`;
            }

            if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
                parsedCases.push({
                    displayIndex: parsedCases.length + 1,
                    code: standardCode,
                    lat: lat,
                    lng: lng,
                    road: ''
                });
            }
        }

        refreshMarkersAndList();

        parsedCases.forEach((c) => {
            fetchRoadName(c.lat, c.lng).then(road => {
                c.road = road;
                refreshMarkersAndList();
            });
        });

        if (parsedCases.length > 0) {
            const allBounds = parsedCases.map(c => [c.lat, c.lng]);
            baseLocations.forEach(loc => allBounds.push([loc.lat, loc.lng]));
            map.fitBounds(allBounds, { padding: [40, 40] });
        }

        if (autoCollapseOnMobile && window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    }

    function copySortedList() {
        if (parsedCases.length === 0) {
            alert("目前尚無標記的案件！");
            return;
        }
        const textToCopy = parsedCases.map(c => `案件${c.displayIndex} ${c.code}`).join('\n');
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`已依排序複製 ${parsedCases.length} 筆案件！`);
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            alert(`已依排序複製 ${parsedCases.length} 筆案件！`);
        } catch (err) {
            alert('複製失敗，請手動選取複製');
        }
        document.body.removeChild(ta);
    }

    function clearAll() {
        markersLayer.clearLayers();
        parsedCases = [];
        document.getElementById('input').value = '';
        listContainer.innerHTML = '';
        map.setView([24.2100, 120.5500], 12);
    }
</script>
</body>
</html>
