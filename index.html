<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPC_GO 排工導航盤</title>

    <!-- PWA 標準宣告 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#212529">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TPC_GO">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: relative; background: #212529; }

        #sidebar { 
            width: 360px; 
            background: #1e1e24; 
            color: #fff;
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            gap: 8px; 
            z-index: 1001; 
            box-shadow: 2px 0 12px rgba(0,0,0,0.5);
            transition: transform 0.25s ease;
        }

        #map { flex: 1; height: 100%; width: 100%; z-index: 1; }

        .header-box { display: flex; justify-content: space-between; align-items: center; }
        h3 { font-size: 16px; color: #60a5fa; font-weight: 800; }

        textarea { 
            width: 100%; 
            height: 95px; 
            padding: 8px; 
            font-size: 13px; 
            resize: none; 
            border: 1px solid #444; 
            border-radius: 6px; 
            font-family: monospace; 
            background: #2b2b36;
            color: #fff;
        }

        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        button { 
            width: 100%; 
            padding: 9px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
            touch-action: manipulation;
        }
        button:active { filter: brightness(0.85); }
        
        .mode-btn { background: #d97706; }
        .mode-btn.active { background: #dc2626; box-shadow: 0 0 10px #dc2626; }
        .copy-btn { background: #16a34a; }
        .clear-btn { background: #4b5563; padding: 5px; font-size: 11px; }
        .install-btn { background: #9333ea; display: none; }

        .quick-stations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-top: 1px solid #333; padding-top: 6px; }
        .quick-btn { background: #2b2b36; color: #cbd5e1; font-size: 11px; padding: 5px 2px; border: 1px solid #444; border-radius: 4px; }

        #list { flex: 1; overflow-y: auto; border-top: 1px solid #333; padding-top: 6px; -webkit-overflow-scrolling: touch; }
        
        .item { 
            background: #2b2b36; 
            padding: 8px 10px; 
            border: 1px solid #404050; 
            border-radius: 6px; 
            margin-bottom: 6px;

            display: flex;

            align-items: center;
            touch-action: pan-y;
            user-select: none;
            color: #fff;
        }
        .drag-handle { cursor: grab; color: #9ca3af; font-size: 16px; margin-right: 8px; }

        .floating-controls {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }
        .float-btn {
            background: #ffffff;
            color: #111;
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);

        /* 標籤樣式：pointer-events auto 讓文字標籤可被點擊 */
        .case-label-large {
            background: rgba(220, 38, 38, 0.95);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
            cursor: pointer !important;
            pointer-events: auto !important;
        }
        .case-road-text { color: #fef08a; font-weight: bold; font-size: 11px; margin-left: 4px; }

        .base-label {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            color: #f1f5f9;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            white-space: nowrap;
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        .inspect-label {
            background: rgba(126, 34, 206, 0.95);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        @media (max-width: 768px) {

                top: 0;
                left: 0;
                width: 100%;
                height: 75vh;
                transform: translateY(-100%);
                border-right: none;
                border-bottom: 3px solid #2563eb;
                border-radius: 0 0 16px 16px;
            }
            #sidebar.mobile-open {
                transform: translateY(0);
            }
            .mobile-toggle-btn {
                display: flex !important;
            }
        }
        .mobile-toggle-btn { display: none; }

<div id="sidebar">

    <textarea id="input" placeholder="貼上今日案件：
青年路50號邊 G4263SA49
六路十五街35號對面 G4458HA31
型份東段781-5地號 G4764AA87"></textarea>

    <div class="btn-group">
        <button id="installAppBtn" class="install-btn" onclick="triggerPWAInstall()">📲 下載安裝為 APP</button>
        <button onclick="renderMarkers(true)">在地圖上標記點位</button>
        <button id="tapSortBtn" class="mode-btn" onclick="toggleTapSortMode()">👆 點圖自動排工順序 (已關閉)</button>

        <button class="quick-btn" onclick="locateBase(1)">沙鹿服務所</button>
        <button class="quick-btn" onclick="locateBase(2)">南勢溪公園</button>
        <button class="quick-btn" onclick="locateBase(3)">萬興陸橋</button>
        <button class="quick-btn" onclick="locateBase(4)">中華向上陸橋</button>

    <div id="list"></div>
</div>

<div id="map"></div>

<div class="floating-controls">
    <div class="float-btn mobile-toggle-btn" onclick="toggleMobileSidebar()" title="案件選單">📋</div>
    <div class="float-btn" onclick="locateUser()" title="定位目前位置與圖號">📍</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let deferredPrompt = null;
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.getElementById('installAppBtn');
        if (btn) btn.style.display = 'block';
    });

    function triggerPWAInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installAppBtn').style.display = 'none';
            });
        }
    }

    function toggleMobileSidebar() {
        document.getElementById('sidebar').classList.toggle('mobile-open');
    }
    function closeMobileSidebar() {
        document.getElementById('sidebar').classList.remove('mobile-open');
    }

    function openGoogleMaps(lat, lng) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    }

    const googleRoads = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['0', '1', '2', '3'],
        attribution: '&copy; Google Maps'
    });

    const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['0', '1', '2', '3'],
        attribution: '&copy; Google Maps'
    });

    const map = L.map('map', {
        center: [24.2200, 120.5500],
        zoom: 13,
        zoomControl: false,
        layers: [googleRoads]
    });

    L.control.zoom({ position: 'topright' }).addTo(map);
    L.control.layers({ "Google 道路": googleRoads, "Google 衛星混合": googleHybrid }, null, { position: 'topright' }).addTo(map);

    const baseLocations = [
        { name: "龍井服務所", lat: 24.193150, lng: 120.546019, color: "green", desc: "公務點" },
        { name: "沙鹿服務所", lat: 24.230309, lng: 120.565418, color: "green", desc: "公務點" },
        { name: "南勢溪公園", lat: 24.215784, lng: 120.564731, color: "orange", desc: "午休點" },
        { name: "萬興陸橋", lat: 24.169068, lng: 120.535600, color: "orange", desc: "午休點" },
        { name: "中華向上陸橋", lat: 24.217655, lng: 120.544649, color: "orange", desc: "午休點" },
        { name: "沙田國三交叉", lat: 24.173208, lng: 120.543228, color: "orange", desc: "停駐點" }
    ];

    const baseMarkers = [];
    baseLocations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng], {
            icon: L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${loc.color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [18, 30],
                iconAnchor: [9, 30],
                popupAnchor: [1, -26],
                shadowSize: [30, 30]
            })
        }).addTo(map);

        const tooltip = marker.bindTooltip(loc.name, { 
            permanent: true, 
            direction: 'bottom', 
            offset: [0, 4], 
            className: 'base-label',
            interactive: true 
        });

        // 點擊文字標籤直接開啟氣泡選單
        tooltip.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            marker.openPopup();
        });

        marker.bindPopup(`
            <b style="font-size:14px;color:#1e293b;">【${loc.desc}】${loc.name}</b><br><br>
            <button onclick="openGoogleMaps(${loc.lat}, ${loc.lng})" style="background:#2563eb;padding:9px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;font-size:13px;">🧭 開啟 Google Maps 導航</button>
        `);
        baseMarkers.push(marker);
    });

    let userLatLng = null;
    let userMarker = null;
    let userCircle = null;
    let inspectMarker = null;
    let parsedCases = [];
    let isTapSortMode = false;
    let tapSortedOrder = [];

    function wgs84ToTWD97(lat, lon) {
        const a = 6378137.0, b = 6356752.314245;
        const lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
        const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = e * e / (1 - e * e);

        const phi = lat * Math.PI / 180;
        const lam = lon * Math.PI / 180;

        const n = a / Math.sqrt(1 - e * e * Math.sin(phi) * Math.sin(phi));
        const t = Math.tan(phi) * Math.tan(phi);
        const c = e2 * Math.cos(phi) * Math.cos(phi);
        const A_val = (lam - lon0) * Math.cos(phi);

        const M = a * ((1 - e * e / 4 - 3 * Math.pow(e, 4) / 64 - 5 * Math.pow(e, 6) / 256) * phi
            - (3 * e * e / 8 + 3 * Math.pow(e, 4) / 32 + 45 * Math.pow(e, 6) / 1024) * Math.sin(2 * phi)
            + (15 * Math.pow(e, 4) / 256 + 45 * Math.pow(e, 6) / 1024) * Math.sin(4 * phi)
            - (35 * Math.pow(e, 6) / 3072) * Math.sin(6 * phi));

        const x = dx + k0 * n * (A_val + (1 - t + c) * Math.pow(A_val, 3) / 6 + (5 - 18 * t + t * t + 72 * c - 58 * e2) * Math.pow(A_val, 5) / 120);
        const y = k0 * (M + n * Math.tan(phi) * (A_val * A_val / 2 + (5 - t + 9 * c + 4 * c * c) * Math.pow(A_val, 4) / 24 + (61 - 58 * t + t * t + 600 * c - 330 * e2) * Math.pow(A_val, 6) / 720));
        return { x, y };
    }

    function twd97ToWGS84(x, y) {
        const a = 6378137.0, b = 6356752.314245;
        const lon0 = 121 * Math.PI / 180, k0 = 0.9999, dx = 250000;
        const e = Math.sqrt(1 - (b * b) / (a * a)), e2 = e * e / (1 - e * e);
        
        x = x - dx;
        const m = y / k0;
        const mu = m / (a * (1 - e * e / 4 - 3 * e * e * e * e / 64 - 5 * e * e * e * e * e * e / 256));
        const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));
        
        const j1 = 3 * e1 / 2 - 27 * e1 * e1 * e1 / 32;
        const j2 = 21 * e1 * e1 / 16 - 55 * e1 * e1 * e1 / 32;
        const j3 = 151 * e1 * e1 * e1 / 96;
        
        const fp = mu + j1 * Math.sin(2 * mu) + j2 * Math.sin(4 * mu) + j3 * Math.sin(6 * mu);
        const c1 = e2 * Math.cos(fp) * Math.cos(fp);
        const t1 = Math.tan(fp) * Math.tan(fp);
        const r1 = a * (1 - e * e) / Math.pow(1 - e * e * Math.sin(fp) * Math.sin(fp), 1.5);
        const n1 = a / Math.sqrt(1 - e * e * Math.sin(fp) * Math.sin(fp));
        const d = x / (n1 * k0);
        
        const lat = fp - (n1 * Math.tan(fp) / r1) * (d * d / 2 - (5 + 3 * t1 + 10 * c1 - 4 * c1 * c1 - 9 * e2) * d * d * d * d / 24);
        const lon = lon0 + (d - (1 + 2 * t1 + c1) * d * d * d / 6) / Math.cos(fp);
        return { lat: lat * 180 / Math.PI, lng: lon * 180 / Math.PI };
    }

    function coordToPowerCode(lat, lng) {
        const pt97 = wgs84ToTWD97(lat, lng);
        const x67 = pt97.x - 828;
        const y67 = pt97.y + 207;

        const originX = 170000;
        const originY = 2650000;

        let dx = x67 - originX;
        let dy = y67 - originY;

        let xMap = Math.floor(dx / 800);
        let yMap = Math.floor(dy / 500);

        let remX = dx - xMap * 800;
        let remY = dy - yMap * 500;

        let subXIndex = Math.floor(remX / 100);
        let subYIndex = Math.floor(remY / 100);

        let subX = String.fromCharCode(65 + Math.min(Math.max(subXIndex, 0), 7));
        let subY = String.fromCharCode(65 + Math.min(Math.max(subYIndex, 0), 4));

        let ptX = Math.floor((remX - subXIndex * 100) / 10);
        let ptY = Math.floor((remY - subYIndex * 100) / 10);

        const pad2 = (n) => String(Math.max(0, n)).padStart(2, '0');
        return `G${pad2(xMap)}${pad2(yMap)}${subX}${subY}${Math.min(Math.max(ptX, 0), 9)}${Math.min(Math.max(ptY, 0), 9)}`;
    }

    function parsePowerCoord(codeStr) {
        let cleaned = codeStr.replace(/\s+/g, '').toUpperCase();
        if (/^\d{4}[A-Z]{2}(\d{2}|\d{4})$/.test(cleaned)) {
            cleaned = 'G' + cleaned;
        }

        const match = cleaned.match(/^([A-HJ-Z])(\d{2})(\d{2})([A-Z])([A-Z])(\d{2}|\d{4})$/);
        if (!match) return null;

        const [_, zone, xMap, yMap, subX, subY, pt] = match;

        const originMap = {
            'A': [170000, 2750000], 'B': [250000, 2750000],
            'C': [170000, 2700000], 'D': [250000, 2700000],
            'E': [170000, 2650000], 'F': [250000, 2650000],
            'G': [170000, 2650000], 'H': [250000, 2600000]
        };

        const baseOrigin = originMap[zone] || [170000, 2650000];
        let twd67X = baseOrigin[0] + parseInt(xMap, 10) * 800;
        let twd67Y = baseOrigin[1] + parseInt(yMap, 10) * 500;

        twd67X += (subX.charCodeAt(0) - 65) * 100;
        twd67Y += (subY.charCodeAt(0) - 65) * 100;

        if (pt.length === 2) {
            twd67X += parseInt(pt[0], 10) * 10 + 5;
            twd67Y += parseInt(pt[1], 10) * 10 + 5;
        } else if (pt.length === 4) {
            twd67X += parseInt(pt.substring(0, 2), 10);
            twd67Y += parseInt(pt.substring(2, 4), 10);
        }

        const twd97X = twd67X + 828;
        const twd97Y = twd67Y - 207;

        return { ...twd97ToWGS84(twd97X, twd97Y), standardCode: cleaned };
    }

    function silentCopy(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => {});
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
    }

    function locateUser() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                userLatLng = [pos.coords.latitude, pos.coords.longitude];
                const myCode = coordToPowerCode(userLatLng[0], userLatLng[1]);

                if (userMarker) {
                    userMarker.setLatLng(userLatLng);
                    userCircle.setLatLng(userLatLng);
                } else {
                    userCircle = L.circle(userLatLng, { radius: pos.coords.accuracy || 30, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.15 }).addTo(map);
                    userMarker = L.circleMarker(userLatLng, { radius: 9, color: '#ffffff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
                }
                
                const myTooltip = userMarker.bindTooltip(`<b>目前位置</b><br><span style="color:#facc15;font-weight:bold;font-size:12px;">${myCode}</span>`, { 
                    permanent: true, direction: 'top', offset: [0, -10], className: 'base-label', interactive: true 
                });

                myTooltip.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    userMarker.openPopup();
                });

                userMarker.bindPopup(`
                    <b>📍 我的目前位置</b><br>
                    台電圖號: <b>${myCode}</b><br>
                    坐標: ${userLatLng[0].toFixed(5)}, ${userLatLng[1].toFixed(5)}<br><br>
                    <button onclick="silentCopy('${myCode}'); this.innerText='✓ 已複製';" style="background:#16a34a;padding:7px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;">📋 複製圖號</button>
                `).openPopup();

                map.flyTo(userLatLng, 17);
            },
            () => {},
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    let pressTimer = null;
    function startLongPress(latlng) {
        cancelLongPress();
        pressTimer = setTimeout(async () => {
            const lat = latlng.lat;
            const lng = latlng.lng;
            const code = coordToPowerCode(lat, lng);

            silentCopy(code);

            if (inspectMarker) map.removeLayer(inspectMarker);

            inspectMarker = L.marker([lat, lng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);

            const road = await fetchRoadName(lat, lng);
            const roadText = road ? ` | ${road}` : '';

            const inspTooltip = inspectMarker.bindTooltip(`<b>${code}</b> (已複製)<span style="color:#fef08a;font-size:11px;">${roadText}</span>`, {
                permanent: true,
                direction: 'top',
                offset: [0, -12],
                className: 'inspect-label',
                interactive: true
            });

            inspTooltip.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                inspectMarker.openPopup();
            });

            inspectMarker.bindPopup(`
                <b>🔍 點位圖號解析</b><br>
                ${road ? `路名: <b>${road}</b><br>` : ''}
                台電圖號: <b style="color:#7e22ce;font-size:15px;">${code}</b> (已自動複製)<br>
                坐標: ${lat.toFixed(5)}, ${lng.toFixed(5)}<br><br>
                <button onclick="openGoogleMaps(${lat}, ${lng})" style="background:#2563eb;padding:9px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;font-size:13px;margin-bottom:6px;">🧭 開啟 Google Maps 導航</button>
                <button onclick="silentCopy('${code}'); this.innerText='✓ 已複製';" style="background:#16a34a;padding:7px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;">📋 再次複製圖號</button>
            `).openPopup();

        }, 500);
    }

    function cancelLongPress() {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    }

    map.on('mousedown', (e) => startLongPress(e.latlng));
    map.on('mouseup', cancelLongPress);
    map.on('mousemove', cancelLongPress);
    map.on('touchstart', (e) => {
        if (e.touches && e.touches.length === 1) {
            const touch = e.touches[0];
            const pt = map.mouseEventToLatLng(touch);
            startLongPress(pt);
        }
    });
    map.on('touchend', cancelLongPress);
    map.on('touchmove', cancelLongPress);

    let markersLayer = L.layerGroup().addTo(map);

    function toggleTapSortMode() {
        if (parsedCases.length === 0) return;
        isTapSortMode = !isTapSortMode;
        const btn = document.getElementById('tapSortBtn');
        if (isTapSortMode) {
            tapSortedOrder = [];
            btn.classList.add('active');
            btn.innerText = '🎯 依序點擊地圖紅點或文字排工...';
            closeMobileSidebar();
        } else {
            btn.classList.remove('active');
            btn.innerText = '👆 點圖自動排工順序 (已關閉)';
        }
    }

    function handleCaseMarkerClick(caseItem) {
        if (!isTapSortMode) return false;
        if (tapSortedOrder.includes(caseItem)) return true;

        tapSortedOrder.push(caseItem);
        caseItem.displayIndex = tapSortedOrder.length;

        if (tapSortedOrder.length === parsedCases.length) {
            parsedCases = [...tapSortedOrder];
            toggleTapSortMode();
        } else {
            const remaining = parsedCases.filter(c => !tapSortedOrder.includes(c));
            remaining.forEach((c, idx) => { c.displayIndex = tapSortedOrder.length + idx + 1; });
            parsedCases = [...tapSortedOrder, ...remaining];
        }

        refreshMarkersAndList();
        return true;
    }

    const listContainer = document.getElementById('list');
    Sortable.create(listContainer, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function () {
            const items = listContainer.querySelectorAll('.item');
            const reordered = [];
            items.forEach((itemDom, newIdx) => {
                const oldIdx = parseInt(itemDom.getAttribute('data-index'), 10);
                const caseData = parsedCases[oldIdx];
                caseData.displayIndex = newIdx + 1;
                reordered.push(caseData);
            });
            parsedCases = reordered;
            refreshMarkersAndList();
        }
    });

    function locateBase(index) {
        const target = baseLocations[index];
        map.flyTo([target.lat, target.lng], 16);
        baseMarkers[index].openPopup();
        closeMobileSidebar();
    }

    async function fetchRoadName(lat, lng) {
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
            const resp = await fetch(url, { headers: { 'Accept-Language': 'zh-TW' } });
            if (!resp.ok) return '';
            const data = await resp.json();
            const addr = data.address || {};
            return addr.road || addr.street || addr.suburb || addr.neighbourhood || '';
        } catch (e) {
            return '';
        }
    }

    function refreshMarkersAndList() {
        markersLayer.clearLayers();
        listContainer.innerHTML = '';
        const bounds = [];
        baseLocations.forEach(loc => bounds.push([loc.lat, loc.lng]));

        parsedCases.forEach((c, idx) => {
            bounds.push([c.lat, c.lng]);

            const marker = L.marker([c.lat, c.lng], {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(markersLayer);
            c.marker = marker;

            // 點擊圖釘本體
            marker.on('click', (e) => {
                if (isTapSortMode) {
                    L.DomEvent.stopPropagation(e);
                    handleCaseMarkerClick(c);
                }
            });

            const title = `案件 ${c.displayIndex}`;
            const roadLabel = c.road ? ` | ${c.road}` : '';

            // 綁定字體 Tooltip 並使其直接能觸發點擊
            const tooltip = marker.bindTooltip(`<b>${title}</b> ${c.code}<span class="case-road-text">${roadLabel}</span>`, {
                permanent: true,
                direction: 'top',
                offset: [0, -12],
                className: 'case-label-large',
                interactive: true
            });

            // 關鍵修正：直接在 Tooltip 上監聽點擊事件
            tooltip.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                if (isTapSortMode) {
                    handleCaseMarkerClick(c);
                } else {
                    marker.openPopup();
                }
            });

            marker.bindPopup(`
                <b style="font-size:15px;color:#dc2626;">${title} (${c.rawName})</b><br>
                ${c.road ? `<b>路名: ${c.road}</b><br>` : ''}
                圖號: <b>${c.code}</b><br>
                坐標: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}<br><br>
                <button onclick="openGoogleMaps(${c.lat}, ${c.lng})" style="background:#dc2626;padding:9px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;font-size:13px;">🧭 開啟 Google Maps 導航</button>
            `);

            const item = document.createElement('div');
            item.className = 'item';
            item.setAttribute('data-index', idx);
            item.innerHTML = `
                <div style="display:flex;align-items:center;flex:1;">
                    <span class="drag-handle">☰</span>
                    <div>
                        <b style="color:#ef4444;font-size:14px;">${title}</b> <span style="font-size:12px;color:#cbd5e1;font-weight:bold;">${c.code}</span><br>
                        <span style="color:#aaa;font-size:11px;">${c.rawName}</span> 
                        <span style="color:#60a5fa;font-size:11px;">${c.road ? `(${c.road})` : ''}</span>
                    </div>
                </div>
            `;
            item.onclick = () => {
                map.flyTo([c.lat, c.lng], 17);
                marker.openPopup();
                closeMobileSidebar();
            };
            listContainer.appendChild(item);
        });
    }

    async function renderMarkers(autoCloseOnMobile = false) {
        parsedCases = [];
        const lines = document.getElementById('input').value.trim().split('\n');

        for (let index = 0; index < lines.length; index++) {
            let line = lines[index].trim();
            if (!line) continue;

            let lat = null, lng = null, standardCode = '', rawName = '';

            const codeMatch = line.match(/([A-Za-z]?\d{4}[A-Za-z]{2}(?:\d{2}|\d{4}))/);
            
            if (codeMatch) {
                const targetCode = codeMatch[1];
                rawName = line.replace(targetCode, '').trim() || `案件 ${index + 1}`;
                const powerRes = parsePowerCoord(targetCode);
                if (powerRes) {
                    lat = powerRes.lat;
                    lng = powerRes.lng;
                    standardCode = powerRes.standardCode;
                }
            } else if (line.includes(',')) {
                const parts = line.split(/\s+/);
                const coordPart = parts.find(p => p.includes(','));
                rawName = parts.filter(p => p !== coordPart).join(' ') || `案件 ${index + 1}`;
                const [la, ln] = coordPart.split(',');
                lat = parseFloat(la);
                lng = parseFloat(ln);
                standardCode = `${lat.toFixed(5)},${lng.toFixed(5)}`;
            }

            if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
                parsedCases.push({
                    displayIndex: parsedCases.length + 1,
                    code: standardCode,
                    rawName: rawName,
                    lat: lat,
                    lng: lng,
                    road: ''
                });
            }
        }

        refreshMarkersAndList();

        parsedCases.forEach((c) => {
            fetchRoadName(c.lat, c.lng).then(road => {
                c.road = road;
                refreshMarkersAndList();
            });
        });

        if (parsedCases.length > 0) {
            const allBounds = parsedCases.map(c => [c.lat, c.lng]);
            baseLocations.forEach(loc => allBounds.push([loc.lat, loc.lng]));
            map.fitBounds(allBounds, { padding: [40, 40] });
        }

        if (autoCloseOnMobile && window.innerWidth <= 768) {
            closeMobileSidebar();
        }
    }

    function copySortedList() {
        if (parsedCases.length === 0) return;
        const textToCopy = parsedCases.map(c => `${c.rawName} ${c.code}`).join('\n');
        silentCopy(textToCopy);
        const btn = document.getElementById('copyBtn');
        btn.innerText = '✓ 已複製成功！';
        setTimeout(() => { btn.innerText = '📋 複製已排案件清單'; }, 1500);
    }

    function clearAll() {
        markersLayer.clearLayers();
        if (inspectMarker) map.removeLayer(inspectMarker);
        parsedCases = [];
        document.getElementById('input').value = '';
        listContainer.innerHTML = '';
        map.setView([24.2200, 120.5500], 13);
    }
</script>
</body>
</html>
