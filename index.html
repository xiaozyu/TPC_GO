<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPC_GO 排工導航盤</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 360px; height: 100%; background: #1e1e24; color: #fff; display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 8px rgba(0,0,0,0.3); }
    #map { flex: 1; height: 100%; }
    .panel-section { padding: 12px; border-bottom: 1px solid #333; }
    .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #4da6ff; }
    input, button, select { width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #444; background: #2a2a32; color: #fff; font-size: 0.9rem; }
    button { background: #0066cc; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0052a3; }
    .point-list { flex: 1; overflow-y: auto; padding: 10px; }
    .point-item { background: #2a2a32; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 0.85rem; border-left: 4px solid #888; display: flex; justify-content: space-between; align-items: center; }
    .point-item.official { border-left-color: #ff4d4d; }
    .point-item.rest { border-left-color: #4dff88; }
    .point-item.task { border-left-color: #4da6ff; }
    .point-info { cursor: pointer; }
    .point-name { font-weight: bold; }
    .point-coords { font-size: 0.75rem; color: #aaa; }
    .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; background: #444; }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="panel-section">
    <div class="title">TPC_GO 排工導航盤</div>
    <input type="text" id="tpcInput" placeholder="台電圖號 (例: C1234AB56 或 S區)" />
    <button onclick="addTpcPoint()">圖號定位並加入</button>
  </div>
  <div class="panel-section">
    <button style="background:#28a745; margin-bottom:0;" onclick="focusFixedPoints()">檢視常駐點位</button>
  </div>
  <div class="point-list" id="pointContainer"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 常駐固定點位數據
  const FIXED_POINTS = [
    { name: "沙鹿服務所", type: "official", lat: 24.230309, lng: 120.565418, desc: "公務點" },
    { name: "龍井服務所", type: "official", lat: 24.193150, lng: 120.546019, desc: "公務點" },
    { name: "沙田國三交叉", type: "rest", lat: 24.173208, lng: 120.543228, desc: "休息點" },
    { name: "萬興陸橋", type: "rest", lat: 24.169068, lng: 120.535600, desc: "休息點" },
    { name: "中華向上路橋", type: "rest", lat: 24.217655, lng: 120.544649, desc: "休息點" },
    { name: "南勢溪公園", type: "rest", lat: 24.215784, lng: 120.564731, desc: "休息點" }
  ];

  // 地圖初始化 (中心設為沙鹿/龍井交界)
  const map = L.map('map').setView([24.2000, 120.5500], 13);
  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
  }).addTo(map);

  const markerGroup = L.featureGroup().addTo(map);

  // 台電圖號轉經緯度算法 (含 S 區溢出外推)
  function tpcToLatLng(code) {
    code = code.trim().toUpperCase();
    const baseGrid = {
      'A': [170000, 2750000], 'B': [250000, 2750000],
      'C': [170000, 2700000], 'D': [250000, 2700000],
      'E': [170000, 2650000], 'F': [250000, 2650000],
      'G': [170000, 2600000], 'H': [250000, 2600000],
      'J': [170000, 2550000], 'K': [250000, 2550000],
      'L': [170000, 2500000], 'M': [250000, 2500000],
      'N': [170000, 2450000], 'P': [250000, 2450000],
      'Q': [170000, 2400000], 'R': [250000, 2400000],
      'S': [170000, 2350000], 'T': [250000, 2350000],
      'U': [90000,  2600000], 'V': [90000,  2550000],
      'W': [90000,  2500000]
    };

    const zone = code.charAt(0);
    if (!baseGrid[zone] || code.length < 5) return null;

    let [baseX, baseY] = baseGrid[zone];
    const xBlock = parseInt(code.substr(1, 2), 10);
    const yBlock = parseInt(code.substr(3, 2), 10);
    if (isNaN(xBlock) || isNaN(yBlock)) return null;

    let twd67X = baseX + (xBlock * 800);
    let twd67Y = baseY + (yBlock * 500);

    // 細格解析 (第 6 碼與第 7 碼)
    if (code.length >= 7) {
      const charX = code.charCodeAt(5);
      const charY = code.charCodeAt(6);
      const subX = (charX >= 73 ? charX - 66 : charX - 65); // 扣除 I 碼邏輯
      const subY = (charY >= 73 ? charY - 66 : charY - 65);
      twd67X += (subX % 8) * 100;
      twd67Y += (subY % 5) * 100;
    }

    // 偏移量解析 (8~9 碼)
    if (code.length >= 9) {
      const offsetX = parseInt(code.substr(7, 1), 10);
      const offsetY = parseInt(code.substr(8, 1), 10);
      if (!isNaN(offsetX) && !isNaN(offsetY)) {
        twd67X += offsetX * 10;
        twd67Y += offsetY * 10;
      }
    }

    // TWD67 轉 WGS84 經驗參數修正
    const wgsX = twd67X + 827.68;
    const wgsY = twd67Y - 207.28;

    return tm2ToLatLng(wgsX, wgsY);
  }

  // TM2 投影反算
  function tm2ToLatLng(x, y) {
    const a = 6378137.0, b = 6356752.314245;
    const lon0 = 121 * Math.PI / 180;
    const k0 = 0.9999, dx = 250000;
    const e = Math.sqrt(1 - (b * b) / (a * a));
    const e2 = (e * e) / (1 - e * e);

    x -= dx;
    const M = y / k0;
    const mu = M / (a * (1 - e * e / 4 - 3 * Math.pow(e, 4) / 64 - 5 * Math.pow(e, 6) / 256));
    const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));

    const J1 = 3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32;
    const J2 = 21 * Math.pow(e1, 2) / 16 - 55 * Math.pow(e1, 4) / 32;
    const J3 = 151 * Math.pow(e1, 3) / 96;

    const fp = mu + J1 * Math.sin(2 * mu) + J2 * Math.sin(4 * mu) + J3 * Math.sin(6 * mu);
    const C1 = e2 * Math.pow(Math.cos(fp), 2);
    const T1 = Math.pow(Math.tan(fp), 2);
    const R1 = a * (1 - e * e) / Math.pow(1 - e * e * Math.pow(Math.sin(fp), 2), 1.5);
    const N1 = a / Math.sqrt(1 - e * e * Math.pow(Math.sin(fp), 2));
    const D = x / (N1 * k0);

    const lat = fp - (N1 * Math.tan(fp) / R1) * (
      D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * e2) * Math.pow(D, 4) / 24 +
      (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * e2 - 3 * C1 * C1) * Math.pow(D, 6) / 720
    );

    const lon = lon0 + (
      D - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6 +
      (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * e2 + 24 * T1 * T1) * Math.pow(D, 5) / 120
    ) / Math.cos(fp);

    return { lat: lat * 180 / Math.PI, lng: lon * 180 / Math.PI };
  }

  // 渲染點位與清單
  function addPointToUI(pt) {
    const colorMap = { official: 'red', rest: 'green', task: 'blue' };
    const marker = L.circleMarker([pt.lat, pt.lng], {
      radius: 7,
      color: colorMap[pt.type] || 'blue',
      fillColor: colorMap[pt.type] || 'blue',
      fillOpacity: 0.8
    }).addTo(markerGroup);

    marker.bindPopup(`<b>${pt.name}</b><br>${pt.desc}<br>${pt.lat.toFixed(6)}, ${pt.lng.toFixed(6)}`);

    const div = document.createElement('div');
    div.className = `point-item ${pt.type}`;
    div.innerHTML = `
      <div class="point-info" onclick="panToPoint(${pt.lat}, ${pt.lng})">
        <div class="point-name">${pt.name}</div>
        <div class="point-coords">${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</div>
      </div>
      <span class="badge">${pt.desc}</span>
    `;
    document.getElementById('pointContainer').appendChild(div);
  }

  function panToPoint(lat, lng) {
    map.setView([lat, lng], 16);
  }

  function focusFixedPoints() {
    map.fitBounds(markerGroup.getBounds());
  }

  function addTpcPoint() {
    const val = document.getElementById('tpcInput').value;
    const res = tpcToLatLng(val);
    if (!res) {
      alert("圖號解析失敗，格式需如: C1234AB56");
      return;
    }
    const pt = { name: val.toUpperCase(), type: "task", lat: res.lat, lng: res.lng, desc: "工單任務點" };
    addPointToUI(pt);
    map.setView([res.lat, res.lng], 16);
    document.getElementById('tpcInput').value = "";
  }

  // 初始化載入常駐點位
  FIXED_POINTS.forEach(pt => addPointToUI(pt));
  focusFixedPoints();
</script>
</body>
</html>
